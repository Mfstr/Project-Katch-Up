version: '3.8'

services:
  db:
    image: postgres:16

    environment:
      # These values are for local development.
      # Change them in .env if needed.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-katchup_dev}

    ports:
      # Format: HOST_PORT:CONTAINER_PORT
      # Change the first port if 5432 is already in use.
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      # Keeps PostgreSQL data when the container is stopped or recreated.
      - db_data:/var/lib/postgresql/data

    healthcheck:
      # Prevents the backend from starting before PostgreSQL is ready.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-katchup_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    ports:
      # README documents the API on port 4000.
      # Change the first port if 4000 is already in use.
      - '${BACKEND_PORT:-4000}:4000'

    environment:
      # Inside Docker, "db" is the PostgreSQL hostname because
      # "db" is the Compose service name.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/katchup_dev}

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    ports:
      # The web client is available at http://localhost:3000.
      # Change the first port if 3000 is already in use.
      - '${FRONTEND_PORT:-3000}:3000'

    environment:
      # This URL is used by the browser to call the backend API.
      # Do not use the PostgreSQL DATABASE_URL here.
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-4000}

    depends_on:
      - backend

volumes:
  db_data:

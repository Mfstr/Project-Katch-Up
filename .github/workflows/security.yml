name: Security Audit

on:
    pull_request:
        branches: [ develop ]
    workflow_call:

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: '22'
                    cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Run npm Audit
              run: npm audit --audit-level=high
            